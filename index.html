<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
</head>
<body>


<nav  class="  p-2   p-3  my-nav  container">
   <div class="head d-flex align-items-center gap-2 left">
  <div class="header row justify-content-center align-items-center">
  <div class="first-icon col-3 ">
    <i class="fa-regular fa-address-book"></i>
  </div>
 <div class="notes col-9">
    <h1>Contact <span>Hub</span></h1>
    <P>Smart Contact Manager</P>
  </div>
  </div>
</div>

<div class="right">
<div class="actions d-flex left-items justify-content-center align-items-center gap-4">
<button class="add"><i class="fa-solid fa-plus "></i> Add Contact </button>
<i class="fa-solid fa-bell"></i>
<i class="fa-solid fa-gear"></i>
<div class="head-image ">
<img src="images/avatar-4.jpg" alt="" class="w-100 rounded-3" >
</div>
</div>
</div>
</nav>


<div class=" container numbers">
<div class="row  mt-3 gx-4 ">
<div class="numbercard col-4  ">
  <div class="info  p-3 border rounded-4 d-flex gap-3">
    <div class="numicon">
      <i class="fa-solid fa-users"></i>
    </div>
    <div class="number">
<span>TOTAL</span>
<h3>1</h3>
    </div>
  </div>
</div>
<div class="numbercard col-4   ">
  <div class="info  p-3 border rounded-4 d-flex gap-3">
    <div class="numicon">
      <i class="fa-solid fa-star"></i>
    </div>
    <div class="number">
      <span>Favorites</span>
<h3>1</h3>
    </div>
  </div>
</div>
<div class="numbercard col-4  ">
  <div class="info  p-3 border rounded-4 d-flex gap-3">
    <div class="numicon">
      <i class="fa-solid fa-heart-pulse"></i>
    </div>
    <div class="number">
<span>Emergency</span>
<h3>1</h3>
    </div>
  </div>
</div>
</div>
</div>

<div class="container mt-4">
<div class="contacts row">
<div class="add-contacts col-8">
<div class="item ">
  <h2>All Contacts</h2>
  <span>Manage and organize your 1 contacts</span>
</div>
<div class="search-box">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input class="p-3 border rounded-4" type="search" placeholder="    Search By Name,phone, or email">
</div>
<div class="cards row mt-3">
<div class="card col-6">
<div class="data p-2">
<div class="image-data">
  <div class="image">
    <img src="images/avatar-4.jpg" alt="" class="w-100 rounded-2">
  </div>
</div>
  </div>
</div>
</div>
</div>
<div class="vip-contact col-4">
</div>
</div>
</div>






<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="main.js"></script>
</body>
</html>
